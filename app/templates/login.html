{% extends "base.html" %}
{% block title %}Log in · {{ brand.name }}{% endblock %}
{% block content %}
<section class="form-stack panel">
  <p class="eyebrow">Settle back in</p><h1>Log in</h1>
  <p>Your member space is a sign-in away.</p>
  {% if error %}<p role="alert">{{ error }}</p>{% endif %}
  <form method="post" action="/login">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <label for="username">Username</label>
    <input id="username" name="username" value="{{ username }}" autocomplete="username" maxlength="32" required>
    <label for="password">Password</label>
    <input id="password" name="password" type="password" autocomplete="current-password" maxlength="128" required>
    <button class="button" type="submit">Log in</button>
  </form>
  <p>New to the harbor? <a href="/signup">Create an account</a>.</p>
</section>
{% endblock %}
